          "for": "2m",
          "labels": {
            "severity": "warning",
            "routing": "local-console",
            "sli": "api_latency"
          },
          "annotations": {
            "summary": "SLOBurnApiLatency3d",
            "runbook": "docs/runbooks/api-errors.md"
          }
        },
        {
          "alert": "SLOBurnProcessing1h",
          "expr": "(lab:processing_burn:1h > 14.4) and (lab:processing_burn:5m > 14.4) and on() (up{job=\"lab-exporter\"} == 1)",
          "for": "2m",
          "labels": {
            "severity": "critical",
            "routing": "local-console",
            "sli": "processing"
          },
          "annotations": {
            "summary": "SLOBurnProcessing1h",
            "runbook": "docs/runbooks/slow-processing.md"
          }
        },
        {
          "alert": "SLOBurnProcessing6h",
