        },
        {
          "record": "lab:demo_processing_miss_ratio:5m",
          "expr": "(sum(lab_processing_cohort_total{traffic=\"fault\",window=\"5m\"}) - sum(lab_processing_cohort_met{traffic=\"fault\",window=\"5m\"})) / clamp_min(sum(lab_processing_cohort_total{traffic=\"fault\",window=\"5m\"}),1)"
        },
        {
          "alert": "LabDemoProcessingMiss",
          "expr": "lab:demo_processing_miss_ratio:5m > 0",
          "for": "15s",
          "labels": {
            "severity": "info",
            "routing": "local-console",
            "mode": "accelerated-demonstration"
          },
          "annotations": {
            "summary": "LabDemoProcessingMiss",
            "runbook": "docs/runbooks/slow-processing.md"
          }
        },
        {
          "alert": "TelemetryUnavailable",
          "expr": "(max(up{job=\"lab-exporter\"}) == 0) or absent(max(up{job=\"lab-exporter\"})) or absent(max(lab_telemetry_heartbeat_seconds)) or (max(time() - lab_scheduler_heartbeat_seconds) > 30)",
          "for": "1m",
          "labels": {
            "severity": "warning",
            "routing": "local-console"
          },
          "annotations": {
