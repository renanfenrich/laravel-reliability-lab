        },
        {
          "record": "lab:api_availability_burn:1h",
          "expr": "lab:api_availability_miss_ratio:1h / 0.001"
        },
        {
          "record": "lab:api_latency_burn:1h",
          "expr": "lab:api_latency_miss_ratio:1h / 0.01"
        },
        {
          "record": "lab:processing_burn:1h",
          "expr": "lab:processing_miss_ratio:1h / 0.01"
        },
        {
          "record": "lab:api_availability_miss_ratio:2h",
