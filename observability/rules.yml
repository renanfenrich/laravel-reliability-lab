          "record": "lab:api_availability_burn:30d",
          "expr": "lab:api_availability_miss_ratio:30d / 0.001"
        },
        {
          "record": "lab:api_latency_burn:30d",
          "expr": "lab:api_latency_miss_ratio:30d / 0.01"
        },
        {
          "record": "lab:processing_burn:30d",
          "expr": "lab:processing_miss_ratio:30d / 0.01"
        },
        {
          "alert": "SLOBurnApiAvailability1h",
          "expr": "(lab:api_availability_burn:1h > 14.4) and (lab:api_availability_burn:5m > 14.4) and on() (up{job=\"lab-exporter\"} == 1)",
          "for": "2m",
          "labels": {
            "severity": "critical",
            "routing": "local-console",
            "sli": "api_availability"
          },
          "annotations": {
            "summary": "SLOBurnApiAvailability1h",
            "runbook": "docs/runbooks/api-errors.md"
          }
        },
        {
          "alert": "SLOBurnApiAvailability6h",
          "expr": "(lab:api_availability_burn:6h > 6) and (lab:api_availability_burn:30m > 6) and on() (up{job=\"lab-exporter\"} == 1)",
          "for": "2m",
          "labels": {
            "severity": "critical",
            "routing": "local-console",
            "sli": "api_availability"
          },
          "annotations": {
            "summary": "SLOBurnApiAvailability6h",
            "runbook": "docs/runbooks/api-errors.md"
          }
        },
        {
          "alert": "SLOBurnApiAvailability1d",
          "expr": "(lab:api_availability_burn:1d > 3) and (lab:api_availability_burn:2h > 3) and on() (up{job=\"lab-exporter\"} == 1)",
          "for": "2m",
          "labels": {
            "severity": "warning",
            "routing": "local-console",
            "sli": "api_availability"
          },
          "annotations": {
            "summary": "SLOBurnApiAvailability1d",
            "runbook": "docs/runbooks/api-errors.md"
          }
        },
        {
          "alert": "SLOBurnApiAvailability3d",
          "expr": "(lab:api_availability_burn:3d > 1) and (lab:api_availability_burn:6h > 1) and on() (up{job=\"lab-exporter\"} == 1)",
          "for": "2m",
          "labels": {
            "severity": "warning",
            "routing": "local-console",
            "sli": "api_availability"
          },
          "annotations": {
            "summary": "SLOBurnApiAvailability3d",
            "runbook": "docs/runbooks/api-errors.md"
          }
        },
        {
          "alert": "SLOBurnApiLatency1h",
          "expr": "(lab:api_latency_burn:1h > 14.4) and (lab:api_latency_burn:5m > 14.4) and on() (up{job=\"lab-exporter\"} == 1)",
          "for": "2m",
          "labels": {
            "severity": "critical",
            "routing": "local-console",
            "sli": "api_latency"
          },
          "annotations": {
            "summary": "SLOBurnApiLatency1h",
            "runbook": "docs/runbooks/api-errors.md"
          }
        },
        {
          "alert": "SLOBurnApiLatency6h",
          "expr": "(lab:api_latency_burn:6h > 6) and (lab:api_latency_burn:30m > 6) and on() (up{job=\"lab-exporter\"} == 1)",
          "for": "2m",
          "labels": {
            "severity": "critical",
            "routing": "local-console",
            "sli": "api_latency"
          },
