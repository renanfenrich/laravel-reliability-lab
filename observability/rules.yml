{
  "groups": [
    {
      "name": "lab-slo",
      "interval": "15s",
      "rules": [
        {
          "record": "lab:api_availability_miss_ratio:5m",
          "expr": "sum(rate(lab_http_total{traffic=\"normal\",class=\"5xx\"}[5m])) / clamp_min(sum(rate(lab_http_total{traffic=\"normal\"}[5m])), 1e-12)"
        },
        {
          "record": "lab:api_latency_miss_ratio:5m",
          "expr": "clamp_min((sum(rate(lab_http_seconds_count{traffic=\"normal\"}[5m])) - sum(rate(lab_http_seconds_bucket{traffic=\"normal\",le=\"0.5\"}[5m]))) / clamp_min(sum(rate(lab_http_seconds_count{traffic=\"normal\"}[5m])), 1e-12), 0)"
        },
        {
          "record": "lab:processing_miss_ratio:5m",
          "expr": "(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"5m\"}) - sum(lab_processing_cohort_met{traffic=\"normal\",window=\"5m\"})) / clamp_min(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"5m\"}), 1)"
        },
        {
          "record": "lab:api_availability_burn:5m",
          "expr": "lab:api_availability_miss_ratio:5m / 0.001"
        },
        {
          "record": "lab:api_latency_burn:5m",
          "expr": "lab:api_latency_miss_ratio:5m / 0.01"
        },
        {
          "record": "lab:processing_burn:5m",
          "expr": "lab:processing_miss_ratio:5m / 0.01"
        },
        {
          "record": "lab:api_availability_miss_ratio:30m",
          "expr": "sum(rate(lab_http_total{traffic=\"normal\",class=\"5xx\"}[30m])) / clamp_min(sum(rate(lab_http_total{traffic=\"normal\"}[30m])), 1e-12)"
        },
        {
          "record": "lab:api_latency_miss_ratio:30m",
          "expr": "clamp_min((sum(rate(lab_http_seconds_count{traffic=\"normal\"}[30m])) - sum(rate(lab_http_seconds_bucket{traffic=\"normal\",le=\"0.5\"}[30m]))) / clamp_min(sum(rate(lab_http_seconds_count{traffic=\"normal\"}[30m])), 1e-12), 0)"
        },
        {
          "record": "lab:processing_miss_ratio:30m",
          "expr": "(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"30m\"}) - sum(lab_processing_cohort_met{traffic=\"normal\",window=\"30m\"})) / clamp_min(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"30m\"}), 1)"
        },
        {
          "record": "lab:api_availability_burn:30m",
          "expr": "lab:api_availability_miss_ratio:30m / 0.001"
        },
        {
          "record": "lab:api_latency_burn:30m",
          "expr": "lab:api_latency_miss_ratio:30m / 0.01"
        },
        {
          "record": "lab:processing_burn:30m",
          "expr": "lab:processing_miss_ratio:30m / 0.01"
        },
        {
          "record": "lab:api_availability_miss_ratio:1h",
          "expr": "sum(rate(lab_http_total{traffic=\"normal\",class=\"5xx\"}[1h])) / clamp_min(sum(rate(lab_http_total{traffic=\"normal\"}[1h])), 1e-12)"
        },
        {
          "record": "lab:api_latency_miss_ratio:1h",
