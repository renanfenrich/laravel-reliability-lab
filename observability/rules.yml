        },
        {
          "record": "lab:api_latency_burn:1d",
          "expr": "lab:api_latency_miss_ratio:1d / 0.01"
        },
        {
          "record": "lab:processing_burn:1d",
          "expr": "lab:processing_miss_ratio:1d / 0.01"
        },
        {
          "record": "lab:api_availability_miss_ratio:3d",
          "expr": "sum(rate(lab_http_total{traffic=\"normal\",class=\"5xx\"}[3d])) / clamp_min(sum(rate(lab_http_total{traffic=\"normal\"}[3d])), 1e-12)"
        },
        {
          "record": "lab:api_latency_miss_ratio:3d",
          "expr": "clamp_min((sum(rate(lab_http_seconds_count{traffic=\"normal\"}[3d])) - sum(rate(lab_http_seconds_bucket{traffic=\"normal\",le=\"0.5\"}[3d]))) / clamp_min(sum(rate(lab_http_seconds_count{traffic=\"normal\"}[3d])), 1e-12), 0)"
        },
        {
          "record": "lab:processing_miss_ratio:3d",
          "expr": "(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"3d\"}) - sum(lab_processing_cohort_met{traffic=\"normal\",window=\"3d\"})) / clamp_min(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"3d\"}), 1)"
        },
        {
          "record": "lab:api_availability_burn:3d",
          "expr": "lab:api_availability_miss_ratio:3d / 0.001"
        },
        {
          "record": "lab:api_latency_burn:3d",
          "expr": "lab:api_latency_miss_ratio:3d / 0.01"
        },
        {
          "record": "lab:processing_burn:3d",
          "expr": "lab:processing_miss_ratio:3d / 0.01"
        },
        {
          "record": "lab:api_availability_miss_ratio:30d",
          "expr": "sum(rate(lab_http_total{traffic=\"normal\",class=\"5xx\"}[30d])) / clamp_min(sum(rate(lab_http_total{traffic=\"normal\"}[30d])), 1e-12)"
        },
        {
          "record": "lab:api_latency_miss_ratio:30d",
          "expr": "clamp_min((sum(rate(lab_http_seconds_count{traffic=\"normal\"}[30d])) - sum(rate(lab_http_seconds_bucket{traffic=\"normal\",le=\"0.5\"}[30d]))) / clamp_min(sum(rate(lab_http_seconds_count{traffic=\"normal\"}[30d])), 1e-12), 0)"
        },
        {
          "record": "lab:processing_miss_ratio:30d",
          "expr": "(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"30d\"}) - sum(lab_processing_cohort_met{traffic=\"normal\",window=\"30d\"})) / clamp_min(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"30d\"}), 1)"
        },
