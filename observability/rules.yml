        },
        {
          "record": "lab:processing_miss_ratio:2h",
          "expr": "(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"2h\"}) - sum(lab_processing_cohort_met{traffic=\"normal\",window=\"2h\"})) / clamp_min(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"2h\"}), 1)"
        },
        {
          "record": "lab:api_availability_burn:2h",
          "expr": "lab:api_availability_miss_ratio:2h / 0.001"
        },
        {
          "record": "lab:api_latency_burn:2h",
          "expr": "lab:api_latency_miss_ratio:2h / 0.01"
        },
        {
          "record": "lab:processing_burn:2h",
          "expr": "lab:processing_miss_ratio:2h / 0.01"
        },
        {
          "record": "lab:api_availability_miss_ratio:6h",
          "expr": "sum(rate(lab_http_total{traffic=\"normal\",class=\"5xx\"}[6h])) / clamp_min(sum(rate(lab_http_total{traffic=\"normal\"}[6h])), 1e-12)"
        },
        {
          "record": "lab:api_latency_miss_ratio:6h",
          "expr": "clamp_min((sum(rate(lab_http_seconds_count{traffic=\"normal\"}[6h])) - sum(rate(lab_http_seconds_bucket{traffic=\"normal\",le=\"0.5\"}[6h]))) / clamp_min(sum(rate(lab_http_seconds_count{traffic=\"normal\"}[6h])), 1e-12), 0)"
        },
        {
          "record": "lab:processing_miss_ratio:6h",
          "expr": "(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"6h\"}) - sum(lab_processing_cohort_met{traffic=\"normal\",window=\"6h\"})) / clamp_min(sum(lab_processing_cohort_total{traffic=\"normal\",window=\"6h\"}), 1)"
        },
        {
          "record": "lab:api_availability_burn:6h",
          "expr": "lab:api_availability_miss_ratio:6h / 0.001"
        },
        {
          "record": "lab:api_latency_burn:6h",
          "expr": "lab:api_latency_miss_ratio:6h / 0.01"
        },
        {
          "record": "lab:processing_burn:6h",
          "expr": "lab:processing_miss_ratio:6h / 0.01"
        },
        {
          "record": "lab:api_availability_miss_ratio:1d",
          "expr": "sum(rate(lab_http_total{traffic=\"normal\",class=\"5xx\"}[1d])) / clamp_min(sum(rate(lab_http_total{traffic=\"normal\"}[1d])), 1e-12)"
        },
        {
          "record": "lab:api_latency_miss_ratio:1d",
          "expr": "clamp_min((sum(rate(lab_http_seconds_count{traffic=\"normal\"}[1d])) - sum(rate(lab_http_seconds_bucket{traffic=\"normal\",le=\"0.5\"}[1d]))) / clamp_min(sum(rate(lab_http_seconds_count{traffic=\"normal\"}[1d])), 1e-12), 0)"
        },
        {
          "record": "lab:processing_miss_ratio:1d",
