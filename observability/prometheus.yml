{
  "global": {
    "scrape_interval": "5s",
    "evaluation_interval": "15s"
  },
  "rule_files": [
    "/etc/prometheus/rules.yml"
  ],
  "scrape_configs": [
    {
      "job_name": "lab-exporter",
      "metrics_path": "/api/metrics",
      "static_configs": [
        {
          "targets": [
            "exporter:8080"
          ]
        }
      ]
    },
    {
      "job_name": "kube-state-metrics",
      "static_configs": [
        {
          "targets": [
            "kube-state-metrics:8080"
          ]
        }
      ]
    },
    {
      "job_name": "prometheus",
      "static_configs": [
        {
          "targets": [
            "localhost:9090"
          ]
        }
      ]
    },
    {
      "job_name": "kubelet-cadvisor",
      "scheme": "https",
      "metrics_path": "/metrics/cadvisor",
      "kubernetes_sd_configs": [
        {
          "role": "node"
        }
      ],
      "authorization": {
        "credentials_file": "/var/run/secrets/kubernetes.io/serviceaccount/token"
      },
      "tls_config": {
        "insecure_skip_verify": true
      },
      "relabel_configs": [
        {
          "source_labels": [
            "__meta_kubernetes_node_name"
          ],
          "target_label": "node"
        }
      ]
    },
    {
      "job_name": "lab-host-docker",
      "scrape_interval": "10s",
      "scrape_timeout": "8s",
      "static_configs": [
        {
          "targets": [
            "lab-host-metrics:19100"
          ]
        }
      ]
    },
    {
      "job_name": "alertmanager",
      "static_configs": [
        {
          "targets": [
            "alertmanager:9093"
          ]
        }
      ]
    },
    {
      "job_name": "mailpit",
      "static_configs": [
        {
          "targets": [
            "mailpit:9090"
          ]
        }
      ]
    },
    {
      "job_name": "api-fpm",
      "metrics_path": "/fpm-metrics",
      "scrape_timeout": "2s",
      "dns_sd_configs": [
        {
          "names": [
            "api-diagnostics.lab.svc.cluster.local"
          ],
          "type": "A",
          "port": 8082,
          "refresh_interval": "5s"
        }
      ]
    }
  ],
  "alerting": {
    "alertmanagers": [
      {
        "static_configs": [
          {
            "targets": [
              "alertmanager:9093"
            ]
          }
        ]
      }
    ]
  }
}
