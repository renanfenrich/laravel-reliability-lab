name: G1 local reliability validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned application and simulator images
        run: make build
      - name: Restricted HTTP runtime configuration
        run: |
          docker run --rm --entrypoint php-fpm laravel-reliability-app:g2 -t
          docker run --rm --user 1000:1000 --read-only --tmpfs /tmp:uid=1000,gid=1000 --entrypoint nginx -v "$PWD/runtime/nginx-api.conf:/etc/lab-nginx/nginx.conf:ro" nginx:1.30.5-alpine -t -c /etc/lab-nginx/nginx.conf
      - name: Application tests against PostgreSQL and Redis
        run: make test
      - name: Local secret and image context boundaries
        run: python3 scripts/verify-safety.py
      - name: Terraform initialization, format and validation (no cluster apply)
        run: |
          docker run --rm -v "$PWD:/work" -w /work/infra hashicorp/terraform:1.16.5 init -backend=false -input=false
          docker run --rm -v "$PWD:/work" -w /work/infra hashicorp/terraform:1.16.5 fmt -check
          docker run --rm -v "$PWD:/work" -w /work/infra hashicorp/terraform:1.16.5 validate
      - name: Alertmanager local SMTP configuration
        run: docker run --rm --entrypoint amtool -v "$PWD/observability:/rules:ro" prom/alertmanager:v0.34.1 check-config /rules/alertmanager.yml
      - name: Deterministic manifests and Kubernetes schema validation
        run: |
          python3 scripts/check-manifests.py
          mkdir -p .runtime
          python3 -c 'import json; json.dump({"apiVersion":"v1","kind":"List","items":list(json.load(open("infra/manifests.json")).values())},open(".runtime/manifest-list.json","w"))'
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.34.0 < .runtime/manifest-list.json
      - name: Deterministic short and intended long-window rules
        run: make rules
      - name: Always stop only dedicated Compose resources
        if: always()
        run: docker compose down
